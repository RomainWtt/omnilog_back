version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: omnilog_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - caddy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omnilog_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - caddy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # ✅ PROD: Use the image built by GitLab CI
    image: git-registry.helmo.be/q220059/omnilog-backend:latest
    container_name: omnilog_api
    # ✅ PROD: Run directly (no --reload)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8008
    ports:
      - "8008:8008"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=True
      - TMDB_API_KEY=${TMDB_API_KEY}
    networks:
      - caddy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  caddy:
    external: true